name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: charles
          POSTGRES_USER: charles
          POSTGRES_PASSWORD: charles_ci_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charles -d charles"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: charles/services/backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: charles
        env:
          DATABASE_URL: postgresql+asyncpg://charles:charles_ci_2026@localhost:5432/charles
          JWT_SECRET: ci-test-secret
          MQTT_BROKER: localhost
          MQTT_PORT: 1883
          MQTT_USER: ""
          MQTT_PASSWORD: ""
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend — vite build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: charles/services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: charles/services/frontend
        run: npm ci

      - name: Build
        working-directory: charles/services/frontend
        run: npm run build

  docker-build:
    name: Docker — build check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t charles-backend ./charles/services/backend

      - name: Build simulator image
        run: docker build -t charles-simulator ./charles/services/simulator

      - name: Build frontend image
        run: docker build -t charles-frontend ./charles/services/frontend
