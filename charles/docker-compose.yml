# ╔══════════════════════════════════════════════════════════════╗
# ║  CHARLES — Copilote IA Vigilance Anesthésique Peropératoire ║
# ║  docker compose up --build                                   ║
# ╚══════════════════════════════════════════════════════════════╝

services:

  # ── MQTT Broker ──────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USER: ${MQTT_USER:-charles}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-charles_mqtt_2026}
    # Génère le fichier passwd au démarrage puis lance le broker
    entrypoint: ["/bin/sh", "-c"]
    user: root
    command:
      - |
        rm -f /mosquitto/data/passwd
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
        chmod 644 /mosquitto/data/passwd
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    restart: unless-stopped

  llm-worker:
    build: ./services/backend
    command: ["python", "-m", "app.llm_worker"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://charles:${POSTGRES_PASSWORD:-charles_dev_2026}@postgres:5432/charles
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      KB_PATH: /kb
      MQTT_PASSWORD_FILE: ${MQTT_PASSWORD_FILE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-meditron:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_ANALYSIS_TIMEOUT_S: ${LLM_ANALYSIS_TIMEOUT_S:-45}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
    volumes:
      - ./kb:/kb:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/llm-worker.hb"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charles
      POSTGRES_USER: charles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charles_dev_2026}
    # ports retirés en prod — accès interne Docker uniquement
    # ports:
    #   - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charles -d charles"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Redis (cache live) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    # ports retirés en prod — accès interne Docker uniquement
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend FastAPI ─────────────────────────────────────────
  backend:
    build: ./services/backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-charles}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-charles_mqtt_2026}
      MQTT_PASSWORD_FILE: ${MQTT_PASSWORD_FILE:-}
      DATABASE_URL: postgresql+asyncpg://charles:${POSTGRES_PASSWORD:-charles_dev_2026}@postgres:5432/charles
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      KB_PATH: /kb
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-meditron:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_ANALYSIS_TIMEOUT_S: ${LLM_ANALYSIS_TIMEOUT_S:-45}
      JWT_SECRET: ${JWT_SECRET:-charles-dev-secret-2026}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      CHARLES_DEFAULT_PASSWORD: ${CHARLES_DEFAULT_PASSWORD:-charles2026}
      CHARLES_DEFAULT_PASSWORD_FILE: ${CHARLES_DEFAULT_PASSWORD_FILE:-}
      CHARLES_ADMIN_PASSWORD: ${CHARLES_ADMIN_PASSWORD:-admin2026}
      CHARLES_ADMIN_PASSWORD_FILE: ${CHARLES_ADMIN_PASSWORD_FILE:-}
      AUTH_TOKEN_EXPIRY_HOURS: ${AUTH_TOKEN_EXPIRY_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      LEARNING_ROOT: /data/learning
      ALERTING_RUNTIME_PATH: /data/runtime/alert_rules.json
      VITALDB_METADATA: /data/vitaldb/clinical_metadata.csv
      VITALDB_CASES: /data/vitaldb/cases
      VITALDB_WAVEFORMS: /data/vitaldb/waveforms
    volumes:
      - ./kb:/kb:ro
      - ./learning:/data/learning:ro
      - ./ops/runtime:/data/runtime
      - ./vitaldb/clinical_metadata.csv:/data/vitaldb/clinical_metadata.csv:ro
      - ./vitaldb/cases:/data/vitaldb/cases:ro
      - ./vitaldb/waveforms:/data/vitaldb/waveforms:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Simulateur clinique ─────────────────────────────────────
  simulator:
    build: ./services/simulator
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-charles}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-charles_mqtt_2026}
      VITALDB_DIR: /data/vitaldb/cases
      VITALDB_WAVES_DIR: /data/vitaldb/waveforms
    volumes:
      - ./vitaldb:/data/vitaldb:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

  # ── Frontend React ──────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_SHOW_DEV_ACCOUNTS: ${VITE_SHOW_DEV_ACCOUNTS:-true}
    environment:
      CHARLES_TLS_MODE: ${CHARLES_TLS_MODE:-selfsigned}
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./ops/certs-local:/etc/nginx/certs
    depends_on:
      - backend
    restart: unless-stopped

  # ── Prometheus (observabilité) ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    restart: unless-stopped

  # ── Grafana (dashboards) ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── MLflow (tracking ML) ────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlflow/mlruns --default-artifact-root file:///mlflow/mlartifacts
    restart: unless-stopped

  # ── Nginx (load balancer) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  mqttdata:
  prometheus_data:
  grafana_data:
  mlflow_data:
