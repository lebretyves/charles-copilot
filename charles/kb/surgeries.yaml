          - voie_centrale_obligatoire
          - sonde_double_lumiere
          - spo2_bilateral
          - temperature_continue
        pertes_sanguines_attendues_ml: [300, 1500]
        transfusion_probable: true

      hernie_inguinale:
        label_fr: "Cure de hernie inguinale"
        label_en: "Inguinal hernia repair"
        approche: [videoscopic, open]
        position: supine
        duree_moy_min: 60
        asa_typique: [1, 2]
