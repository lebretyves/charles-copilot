departments:

  # =========================================================================
  # CHIRURGIE GÉNÉRALE — 4 930 cas VitalDB (77.2%)
  # =========================================================================
  chirurgie_generale:
    label_fr: "Chirurgie générale"
    label_en: "General Surgery"
    vitaldb_n: 4930
    vitaldb_pct: 77.2

    procedures:

      # --- Hépatobiliaire ---
      hepatectomie:
        label_fr: "Hépatectomie"
        label_en: "Hepatectomy"
        approche: [open, videoscopic, robotic]
        position: supine
        duree_moy_min: 240
        asa_typique: [2, 3]
        risques_specifiques:
          - hemorragie_massive
          - hypothermie
          - coagulopathie
          - embolie_gazeuse
          - hypoglycemie_postop
        monitorage_specifique:
          - voie_arterielle_obligatoire
          - voie_centrale_recommandee
          - debit_cardiaque_si_majeure
          - temperature_continue
        pertes_sanguines_attendues_ml: [500, 2000]
        transfusion_probable: true
        vitaldb_tracks_pertinents:
          - Solar8000/ART_SBP
          - Solar8000/ART_DBP
          - Vigileo/SVV
          - EV1000/CO

      cholecystectomie:
        label_fr: "Cholécystectomie"
        label_en: "Cholecystectomy"
        approche: [videoscopic, open]
        position: supine_trendelenburg_inverse
        duree_moy_min: 90
        asa_typique: [1, 2]
        risques_specifiques:
          - pneumoperitoine_co2
          - vagal_reflex
          - conversion_laparotomie
          - lesion_voie_biliaire
        monitorage_specifique:
          - etco2_vigilance_augmentee
          - pression_insufflation
        pertes_sanguines_attendues_ml: [20, 100]
        transfusion_probable: false

      gastrectomie:
        label_fr: "Gastrectomie"
        label_en: "Gastrectomy"
        approche: [open, videoscopic, robotic]
        position: supine
        duree_moy_min: 200
        asa_typique: [2, 3]
        risques_specifiques:
          - hemorragie
          - hypothermie
          - denutrition_preop
          - fistule_anastomotique_postop
        monitorage_specifique:
          - voie_arterielle_recommandee
          - temperature_continue
          - sonde_gastrique
        pertes_sanguines_attendues_ml: [200, 800]
        transfusion_probable: true

      colectomie:
        label_fr: "Colectomie"
        label_en: "Colectomy"
