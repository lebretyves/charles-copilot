          - etco2_vigilance_augmentee
          - bis_recommande
          - pni_brassard_adapte
        pertes_sanguines_attendues_ml: [50, 200]
        transfusion_probable: false

      thyroidectomie:
        label_fr: "Thyroïdectomie"
        label_en: "Thyroidectomy"
