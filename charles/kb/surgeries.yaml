          - coagulopathie
          - instabilite_hemodynamique_prolongee
        monitorage_specifique:
          - voie_arterielle_obligatoire
          - voie_centrale_obligatoire
          - debit_cardiaque_recommande
          - temperature_continue
          - glycemie_horaire
        pertes_sanguines_attendues_ml: [500, 3000]
        transfusion_probable: true

      oesophagectomie:
        label_fr: "Œsophagectomie"
        label_en: "Esophagectomy"
        approche: [open, videoscopic]
        position: supine_puis_lateral
        duree_moy_min: 420
        asa_typique: [2, 3]
        risques_specifiques:
