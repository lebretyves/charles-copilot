        - PAS
        - FC
        - shock_index
        - hemoglobin
        - fibrinogen
        - calcium_ionized
        - coagulation
      already_covered:
        - "saignement metadata"
        - "transfusion metadata"
        - "instabilite hemodynamique"
        - "anemie biologique"
      missing_for_strong_parity:
        - "fibrinogene reel si absent du case"
        - "TP/TCA reel structure dans tous les cas"
        - "calcémie ionisee partout"
        - "quantification temporelle de l'aggravation"
    wave_alignment:
      status: aligned_light
      supporting_signals:
        - art
        - pleth
      supporting_wave_features:
        - "waveform amplitude collapse"
      missing_for_strong_parity:
