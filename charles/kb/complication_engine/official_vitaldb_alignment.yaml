version: "2026-04-01"
goal: "aligner les complications officielles et VitalDB sur un meme objet canonique"

current_vitaldb_assets:
  problem_ids:
    - hemodynamic_instability
    - respiratory_instability
    - airway_mechanics_issue
    - depth_excess
    - light_anesthesia_possible
    - hemorrhage_context
    - vasopressor_dependence_context
    - adverse_outcome_context
    - difficult_airway_context
    - metabolic_derangement_context
    - signal_quality_issue
    - stable_segment
  case_complication_tags:
    - emergency_case
    - postop_icu_admission
    - in_hospital_mortality
    - major_blood_loss
    - massive_blood_loss
    - rbc_transfusion
    - plasma_transfusion
    - vasopressor_support
    - ephedrine_support
    - phenylephrine_support
    - epinephrine_support
    - difficult_airway_proxy
    - intraop_anemia_lab
    - intraop_acidemia_lab
    - severe_intraop_acidemia_lab
    - intraop_hypercapnia_lab
    - intraop_hyperglycemia_lab
    - intraop_hyperkalemia_lab
    - intraop_hypokalemia_lab
    - renal_dysfunction_lab

complication_alignment:
  - complication_id: hypotension_perioperatoire
    official_topic_path: "kb/sources_officielles/complications/hypotension_perioperatoire"
    no_wave_alignment:
      status: aligned_partial
      primary_problem_ids:
        - hemodynamic_instability
      supporting_case_tags:
        - vasopressor_support
        - ephedrine_support
        - phenylephrine_support
      supporting_metrics:
        - PAM
        - PAS
        - FC
        - pam_delta
      already_covered:
        - "PAM basse"
        - "PAS basse"
        - "tachycardie associee"
        - "tendance PAM descendante"
      missing_for_strong_parity:
        - "baseline tensionnelle patient pour vraie baisse relative"
        - "burden hypotensif cumule"
        - "duree sous seuil explicite par segment"
    wave_alignment:
      status: aligned_light
      supporting_signals:
        - art
        - pleth
        - co2
      supporting_wave_features:
        - "perfusion signal stability"
        - "pleth amplitude drop"
      missing_for_strong_parity:
        - "vraie integration waveform dans le score officiel d'hypotension"

  - complication_id: choc_hemorragique_transfusion_massive
    official_topic_path: "kb/sources_officielles/complications/choc_hemorragique_transfusion_massive"
