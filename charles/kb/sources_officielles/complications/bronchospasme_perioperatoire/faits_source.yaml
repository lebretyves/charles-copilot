  statut: direct_source
  force_source: pratique
  fact_type: treatment_threshold
  statement: En cas de persistance du bronchospasme, l'adrenaline IVD titree est indiquee entre 10 et 100 microgrammes.
  metric: adrenaline
  rule_type: treatment_dose
  value_text: 10 a 100 ug
