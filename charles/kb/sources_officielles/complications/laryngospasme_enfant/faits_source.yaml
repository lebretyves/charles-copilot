  force_source: pratique
  fact_type: treatment_threshold
  statement: La CPAP avec FiO2 a 100 % fait partie de la prise en charge initiale du laryngospasme chez l'enfant.
  metric: FiO2
  rule_type: first_line
  value_text: 100 %
