- fact_id: initial_dantrolene_2_5_mg_per_kg
  statut: direct_source
  force_source: normative
  fact_type: treatment_threshold
  statement: La dose initiale de dantrolene est de 2,5 mg/kg IVD.
  metric: dantrolene
  rule_type: treatment_dose
  value_text: 2,5 mg/kg IVD
  source_ref: sfar_ac_hyperthermie_maligne
