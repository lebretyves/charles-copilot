topic_id: hyperthermie_maligne
faits:
- fact_id: triggers_halogenes_sux
  statut: direct_source
  force_source: normative
  fact_type: trigger_context
  statement: Les agents halogenes et la succinylcholine sont des facteurs declenchants explicites de l'hyperthermie maligne.
  source_ref: sfar_ac_hyperthermie_maligne
  source_title: SFAR aide cognitive Hyperthermie maligne
