  source_support_type: pdf
- fact_id: max_dantrolene_10_mg_per_kg
  statut: direct_source
  force_source: normative
  fact_type: treatment_threshold
  statement: La dose totale maximale de dantrolene est de 10 mg/kg.
  metric: dantrolene
  rule_type: cumulative_max
  value_text: 10 mg/kg
  source_ref: sfar_ac_hyperthermie_maligne
  source_title: SFAR aide cognitive Hyperthermie maligne
