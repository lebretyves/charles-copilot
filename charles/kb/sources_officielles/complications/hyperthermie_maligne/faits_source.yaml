- fact_id: repeat_dantrolene_1_mg_per_kg
  statut: direct_source
  force_source: normative
  fact_type: treatment_threshold
  statement: En cas d'echec apres quelques minutes, une dose complementaire de 1 mg/kg IVD peut etre repetee.
  metric: dantrolene
  rule_type: repeat_dose
  value_text: 1 mg/kg IVD
  source_ref: sfar_ac_hyperthermie_maligne
  source_title: SFAR aide cognitive Hyperthermie maligne
