- fact_id: cooling_stop_under_38
  statut: direct_source
  force_source: pratique
  fact_type: threshold
  statement: Le refroidissement doit etre arrete des que la temperature centrale passe sous 38 C.
  metric: temperature
  rule_type: cooling_stop_threshold
  value_text: < 38 C
  source_ref: mapar_hyperthermie_maligne
  source_title: MAPAR Fiche urgence Hyperthermie maligne adulte-enfant
  source_url: https://www.mapar.org/contenu/fichetechnique/protocoles_mapar_2016_fiche_urgence_15_hyperthermie_maligne.pdf
  source_organisme: MAPAR
  source_class_id: professionnelle_pratique_fr
  source_support_type: pdf
- fact_id: hyperventilation_two_to_three_times_minute_ventilation
  statut: direct_source
  force_source: pratique
  fact_type: treatment_threshold
  statement: L'hyperventilation est recommandee a 2 a 3 fois la ventilation minute en oxygene pur.
  metric: ventilation
  rule_type: treatment_intensity
  value_text: 2 a 3 x ventilation minute
  source_ref: mapar_hyperthermie_maligne
  source_title: MAPAR Fiche urgence Hyperthermie maligne adulte-enfant
  source_url: https://www.mapar.org/contenu/fichetechnique/protocoles_mapar_2016_fiche_urgence_15_hyperthermie_maligne.pdf
  source_organisme: MAPAR
  source_class_id: professionnelle_pratique_fr
  source_support_type: pdf
- fact_id: saline_cooling_15_ml_per_kg_x3
  statut: direct_source
  force_source: pratique
  fact_type: treatment_threshold
  statement: Le refroidissement interne peut utiliser du NaCl 0,9 % glace a 15 ml/kg en 15 min, jusqu'a trois fois.
  metric: cooling_fluid
  rule_type: treatment_dose
  value_text: 15 ml/kg en 15 min x3
  source_ref: mapar_hyperthermie_maligne
  source_title: MAPAR Fiche urgence Hyperthermie maligne adulte-enfant
  source_url: https://www.mapar.org/contenu/fichetechnique/protocoles_mapar_2016_fiche_urgence_15_hyperthermie_maligne.pdf
  source_organisme: MAPAR
  source_class_id: professionnelle_pratique_fr
  source_support_type: pdf
- fact_id: bicarbonate_1_meq_per_kg
  statut: direct_source
  force_source: normative
  fact_type: treatment_threshold
  statement: Le bicarbonate de sodium est propose a 1 mEq/kg en cas d'acidose metabolique.
  metric: bicarbonate
  rule_type: treatment_dose
